name: Deploy

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      question_app_ec2_public_ip: ${{ steps.terraform_outputs.outputs.question_app_ec2_public_ip }}
      question_app_ec2_private_ip: ${{ steps.terraform_outputs.outputs.question_app_ec2_private_ip }}
      question_app_url: ${{ steps.terraform_outputs.outputs.question_app_url }}
      question_app_security_group_id: ${{ steps.terraform_outputs.outputs.question_app_security_group_id }}
      submit_app_ec2_public_ip: ${{ steps.terraform_outputs.outputs.submit_app_ec2_public_ip }}
      submit_app_ec2_private_ip: ${{ steps.terraform_outputs.outputs.submit_app_ec2_private_ip }}
      submit_app_url: ${{ steps.terraform_outputs.outputs.submit_app_url }}
      submit_app_security_group_id: ${{ steps.terraform_outputs.outputs.submit_app_security_group_id }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init

      - name: Format Terraform code
        run: terraform fmt -check

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Get Terraform runner public IP
        if: ${{ inputs.terraform_action == 'apply' }}
        id: runner_ip
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"

      - name: Plan Terraform apply
        if: ${{ inputs.terraform_action == 'apply' }}
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allowed_ssh_cidr: ${{ steps.runner_ip.outputs.cidr || secrets.ALLOWED_SSH_CIDR }}
          TF_VAR_question_app_cidr: ${{ secrets.QUESTION_APP_CIDR }}
          TF_VAR_submit_app_cidr: ${{ secrets.SUBMIT_APP_CIDR }}
          TF_VAR_aws_ami_id: ${{ secrets.AWS_AMI_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_public_route_config: '{ cidr_block = "0.0.0.0/0" }'
          TF_VAR_ssh_port: 22
          TF_VAR_question_app_port: 4000
          TF_VAR_submit_app_port: 4200

      - name: Plan Terraform destroy
        if: ${{ inputs.terraform_action == 'destroy' }}
        run: terraform plan -destroy -out=tfplan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
          TF_VAR_question_app_cidr: ${{ secrets.QUESTION_APP_CIDR }}
          TF_VAR_submit_app_cidr: ${{ secrets.SUBMIT_APP_CIDR }}
          TF_VAR_aws_ami_id: ${{ secrets.AWS_AMI_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_public_route_config: '{ cidr_block = "0.0.0.0/0" }'
          TF_VAR_ssh_port: 22
          TF_VAR_question_app_port: 4000
          TF_VAR_submit_app_port: 4200

      - name: Run Terraform action
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        if: ${{ inputs.terraform_action == 'apply' }}
        id: terraform_outputs
        run: |
          echo "question_app_ec2_public_ip=$(terraform output -raw question_app_ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "question_app_ec2_private_ip=$(terraform output -raw question_app_ec2_private_ip)" >> "$GITHUB_OUTPUT"
          echo "question_app_url=$(terraform output -raw question_app_url)" >> "$GITHUB_OUTPUT"
          echo "question_app_security_group_id=$(terraform output -raw question_app_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "submit_app_ec2_public_ip=$(terraform output -raw submit_app_ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "submit_app_ec2_private_ip=$(terraform output -raw submit_app_ec2_private_ip)" >> "$GITHUB_OUTPUT"
          echo "submit_app_url=$(terraform output -raw submit_app_url)" >> "$GITHUB_OUTPUT"
          echo "submit_app_security_group_id=$(terraform output -raw submit_app_security_group_id)" >> "$GITHUB_OUTPUT"

  deploy-question-app:
    name: Deploy question app
    if: ${{ inputs.terraform_action == 'apply' }}
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize deployment runner SSH
        id: runner_ip
        env:
          SECURITY_GROUP_ID: ${{ needs.terraform.outputs.question_app_security_group_id }}
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"
          existing_rule=$(aws ec2 describe-security-groups \
            --group-ids "$SECURITY_GROUP_ID" \
            --filters \
              "Name=ip-permission.from-port,Values=22" \
              "Name=ip-permission.to-port,Values=22" \
              "Name=ip-permission.cidr,Values=${runner_ip}/32" \
            --query 'length(SecurityGroups)' \
            --output text)
          if [ "$existing_rule" = "0" ]; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "${runner_ip}/32"
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          EC2_PUBLIC_IP: ${{ needs.terraform.outputs.question_app_ec2_public_ip }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/quizx-ec2-key
          chmod 600 ~/.ssh/quizx-ec2-key
          cat > ~/.ssh/config <<EOF
          Host quizx-question-app
            HostName ${EC2_PUBLIC_IP}
            User ubuntu
            IdentityFile ~/.ssh/quizx-ec2-key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Wait for question EC2 Docker readiness
        run: |
          for attempt in {1..30}; do
            if ssh quizx-question-app 'cloud-init status --wait || true; sudo docker --version && sudo docker compose version'; then
              exit 0
            fi
            echo "Waiting for question app EC2... attempt ${attempt}/30"
            sleep 10
          done
          exit 1

      - name: Copy application files to question EC2
        run: |
          tar \
            --exclude='.git' \
            --exclude='aws' \
            --exclude='**/node_modules' \
            --exclude='infra/terraform/.terraform' \
            --exclude='infra/terraform/terraform.tfvars' \
            --exclude='infra/terraform/terraform.tfstate*' \
            --exclude='terraform.tfstate' \
            --exclude='quiz_x_aws_v_1_0_0_daily_project_plan.md' \
            --exclude='project' \
            -czf - . \
            | ssh quizx-question-app '
                rm -rf ~/quizx-aws-distributed-system
                mkdir -p ~/quizx-aws-distributed-system
                tar -xzf - -C ~/quizx-aws-distributed-system
              '

      - name: Start question app
        env:
          SUBMIT_APP_PRIVATE_IP: ${{ needs.terraform.outputs.submit_app_ec2_private_ip }}
        run: |
          ssh quizx-question-app "
            cd ~/quizx-aws-distributed-system
            RABBITMQ_HOST=${SUBMIT_APP_PRIVATE_IP} \\
              sudo -E docker compose -f infra/docker/docker-compose-question-app-ec2.yml up -d --build mysql question-app
            sudo docker compose -f infra/docker/docker-compose-question-app-ec2.yml ps
          "

      - name: Check question app health
        run: |
          for attempt in {1..30}; do
            if ssh quizx-question-app 'curl -fsS http://localhost:4000/health'; then
              exit 0
            fi
            echo "Waiting for question app health... attempt ${attempt}/30"
            sleep 10
          done
          exit 1

      - name: Revoke deployment runner SSH
        if: ${{ always() && steps.runner_ip.outputs.authorized == 'true' }}
        env:
          SECURITY_GROUP_ID: ${{ needs.terraform.outputs.question_app_security_group_id }}
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" 2>/dev/null || true

  deploy-submit-app:
    name: Deploy submit app
    if: ${{ inputs.terraform_action == 'apply' }}
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize deployment runner SSH
        id: runner_ip
        env:
          SECURITY_GROUP_ID: ${{ needs.terraform.outputs.submit_app_security_group_id }}
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"
          existing_rule=$(aws ec2 describe-security-groups \
            --group-ids "$SECURITY_GROUP_ID" \
            --filters \
              "Name=ip-permission.from-port,Values=22" \
              "Name=ip-permission.to-port,Values=22" \
              "Name=ip-permission.cidr,Values=${runner_ip}/32" \
            --query 'length(SecurityGroups)' \
            --output text)
          if [ "$existing_rule" = "0" ]; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "${runner_ip}/32"
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          EC2_PUBLIC_IP: ${{ needs.terraform.outputs.submit_app_ec2_public_ip }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/quizx-ec2-key
          chmod 600 ~/.ssh/quizx-ec2-key
          cat > ~/.ssh/config <<EOF
          Host quizx-submit-app
            HostName ${EC2_PUBLIC_IP}
            User ubuntu
            IdentityFile ~/.ssh/quizx-ec2-key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Wait for submit EC2 Docker readiness
        run: |
          for attempt in {1..30}; do
            if ssh quizx-submit-app 'cloud-init status --wait || true; sudo docker --version && sudo docker compose version'; then
              exit 0
            fi
            echo "Waiting for submit app EC2... attempt ${attempt}/30"
            sleep 10
          done
          exit 1

      - name: Copy application files to submit EC2
        run: |
          tar \
            --exclude='.git' \
            --exclude='aws' \
            --exclude='**/node_modules' \
            --exclude='infra/terraform/.terraform' \
            --exclude='infra/terraform/terraform.tfvars' \
            --exclude='infra/terraform/terraform.tfstate*' \
            --exclude='terraform.tfstate' \
            --exclude='quiz_x_aws_v_1_0_0_daily_project_plan.md' \
            --exclude='project' \
            -czf - . \
            | ssh quizx-submit-app '
                rm -rf ~/quizx-aws-distributed-system
                mkdir -p ~/quizx-aws-distributed-system
                tar -xzf - -C ~/quizx-aws-distributed-system
              '

      - name: Start submit app
        env:
          QUESTION_APP_PRIVATE_IP: ${{ needs.terraform.outputs.question_app_ec2_private_ip }}
        run: |
          ssh quizx-submit-app "
            cd ~/quizx-aws-distributed-system
            QUESTION_APP_BASE_URL=http://${QUESTION_APP_PRIVATE_IP}:4000 \\
              sudo -E docker compose -f infra/docker/docker-compose-submit-app-ec2.yml up -d --build
            sudo docker compose -f infra/docker/docker-compose-submit-app-ec2.yml ps
          "

      - name: Check submit app health
        run: |
          for attempt in {1..30}; do
            if ssh quizx-submit-app 'curl -fsS http://localhost:4200/health'; then
              exit 0
            fi
            echo "Waiting for submit app health... attempt ${attempt}/30"
            sleep 10
          done
          exit 1

      - name: Revoke deployment runner SSH
        if: ${{ always() && steps.runner_ip.outputs.authorized == 'true' }}
        env:
          SECURITY_GROUP_ID: ${{ needs.terraform.outputs.submit_app_security_group_id }}
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" 2>/dev/null || true
