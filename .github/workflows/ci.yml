name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_VERSION: 4.0.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Application formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application formatting
        run: >-
          npx --yes prettier@3.6.2 --check
          "app/**/*.{js,json,html,css}"
          ".github/workflows/ci.yml"
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
      
            console.log(JSON.stringify({
              issuer: payload.iss,
              audience: payload.aud,
              subject: payload.sub
            }, null, 2));
            
      - name: Configuring AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_BOOTSTRAP_ROLE_ARN}}
          role-session-name: quizx-${{github.job}}-${{github.run_id}}
          aws-region: ${{secrets.AWS_REGION}}
          retry-max-attempts: 1
