name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Application formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application formatting
        run: >-
          npx --yes prettier@3.6.2 --check
          "app/**/*.{js,json,html,css}"
          ".github/workflows/ci.yml"

  app-checks:
    name: ${{ matrix.name }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Question app
            directory: app/question-app/src
          - name: Submit app
            directory: app/submit-app/src
          - name: ETL consumer
            directory: app/etl-consumer/src
          - name: Moderate app
            directory: app/moderate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: ${{ matrix.directory }}
        run: npm run check

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: npm run test --if-present

  bootstrap-validation:
    name: Bootstrap Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bootstrap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  terraform-infra:
    name: Application infrastructure Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  docker-checks:
    name: Docker Compose checks
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      RABBITMQ_PASSWORD: ci-password
      RABBITMQ_QUEUE: ci-queue
      RABBITMQ_USER: ci-user

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose files
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose-question-app-ec2.yml config --quiet
          docker compose -f infra/docker/docker-compose-submit-app-ec2.yml config --quiet

      - name: Build all application images
        run: docker compose -f infra/docker/docker-compose.yml build
