name: Project Bootstrap
on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to perform (plan, apply, destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VAR_tf_bootstrap_state_bucket_name: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET_NAME }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_quizx_iam_user: ${{ secrets.QUIZX_IAM_USER }}
  TF_VAR_quizx_iam_role: ${{ secrets.QUIZX_IAM_ROLE }}

jobs:
  terraform:
    name: Setting Up Environment Variables
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bootstrap
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BOOTSTRAP_STATE_BUCKET_NAME }}" \
            -backend-config="key=${{ secrets.TF_BOOTSTRAP_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Plan
        if: ${{ github.event.inputs.terraform_action == 'plan' }}
        run: terraform plan

      - name: Terraform Apply
        if: ${{ github.event.inputs.terraform_action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        run: terraform destroy -auto-approve

