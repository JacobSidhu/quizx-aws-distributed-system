x-app-db-environment: &app-db-environment
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}

x-rabbitmq-environment: &rabbitmq-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}

services:
  mysql:
    build:
      context: ../../database
      dockerfile: Dockerfile
    image: quizx-mysql:latest
    container_name: quizx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - quizx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - quizx_backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quizx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - quizx_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - quizx_backend

  question-app:
    build:
      context: ../../app/question-app
      dockerfile: Dockerfile
    image: quizx-question-app:latest
    container_name: quizx-question-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      <<: *app-db-environment
    ports:
      - "4000:4000"
    networks:
      - quizx_backend

  submit-app:
    build:
      context: ../../app/submit-app
      dockerfile: Dockerfile
    image: quizx-submit-app:latest
    container_name: quizx-submit-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 4200
      QUESTION_APP_BASE_URL: http://question-app:4000
      <<: *rabbitmq-environment
    volumes:
      - submit_app_data:/var/lib/category
    ports:
      - "4200:4200"
    networks:
      - quizx_backend

  etl-consumer:
    profiles:
      - etl
    build:
      context: ../../app/etl-consumer
      dockerfile: Dockerfile
    image: quizx-etl-consumer:latest
    container_name: quizx-etl-consumer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*app-db-environment, *rabbitmq-environment]
      QUEUE_PREFETCH: 5
    networks:
      - quizx_backend

networks:
  quizx_backend:
    name: quizx-docker-network
    driver: bridge

volumes:
  quizx_mysql_data:
  quizx_rabbitmq_data:
  submit_app_data:
